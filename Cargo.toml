[workspace]
resolver = "3"
members = ["crates/magnetite-core", "crates/magnetite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/magnetite-rs/magnetite"
homepage = "https://github.com/magnetite-rs/magnetite"
authors = ["Magnetite contributors"]
keywords = ["torrent", "bittorrent", "magnet", "bencode", "p2p"]
categories = ["network-programming", "parser-implementations"]

# Every dependency below is pinned to the latest stable release verified
# against crates.io at bootstrap time (see scripts/versions.json upstream).
[workspace.dependencies]
magnetite-core = { path = "crates/magnetite-core", version = "0.1.0" }
anyhow = "1.0.104"
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
criterion = "0.8.2"
data-encoding = "2.11.1"
hex = "0.4.3"
percent-encoding = "2.3.2"
predicates = "3.1.4"
proptest = "1.12.0"
serde_json = "1.0.154"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Pedantic clippy is the house style from day one. CI runs `-D warnings`, so
# every pedantic warning is a hard failure. The three blanket allows below are
# deliberate, documented trade-offs, not sloppiness.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `magnetite_core::bencode` reads better than `magnetite_core::bencode_codec`.
module_name_repetitions = "allow"
# A parser library returns new values everywhere; `#[must_use]` on every getter
# is noise without signal.
must_use_candidate = "allow"
# The domain is full of CamelCase terms (BitTorrent, UDPTracker, BEP9); forcing
# backticks around all of them hurts readability more than it helps.
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
